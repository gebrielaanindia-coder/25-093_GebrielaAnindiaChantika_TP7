<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Form Kontak</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>

    body{
      background-color: #f5f5f5;
    }

    .hero{
      background-color: #9ad6d0;
      color: rgb(31, 33, 43);
      text-align: center;
      padding: 100px 20px;
    }

    .section{
      padding: 60px 0;
    }

    .form-card{
      border-radius: 15px;
    }

    footer{
      background-color: #9ad6d0;
      color: rgb(31, 33, 43);
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }

  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">
        Portofolio
      </a>
      <button class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">
              Tentang Saya
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="makanan.html">
              Makanan Favorit
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="kampus.html">
              Kampus Saya
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="formkontak.html">
              Kontak
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="hero">
    <div class="container">
      <h1 class="display-4 fw-bold">
        Form Kontak
      </h1>
      <p class="fs-5">
        Silakan isi data kontak anda
      </p>
    </div>

  </section>

  <section class="section">
    <div class="container">
      <div class="card shadow p-5 form-card">
        <h2 class="text-center mb-4">
          Input Data Kontak
        </h2>

        <form id="contactForm">

          <div class="mb-3">
            <label class="form-label">
              Email
            </label>
            <input
            type="email"
            class="form-control"
            id="email"
            required>
          </div>

          <div class="mb-3">
            <label class="form-label">
              Instagram
            </label>
            <input
            type="text"
            class="form-control"
            id="instagram"
            required>
          </div>

          <div class="mb-3">
            <label class="form-label">
              No WhatsApp
            </label>
            <input
            type="text"
            class="form-control"
            id="wa"
            required>
          </div>
        
          <button
          type="submit"
          class="btn btn-dark w-100">
            Submit
          </button>
        </form>
      </div>

      <div
      class="card shadow p-5 mt-4 d-none"
      id="hasil">
        <h2 class="text-center mb-4">
          Data Yang Diinput
        </h2>
        <p>
          <strong>Email:</strong>
          <span id="hasilEmail"></span>
        </p>
        <p>
          <strong>Instagram:</strong>
          <span id="hasilInstagram"></span>
        </p>
        <p>
          <strong>No WhatsApp:</strong>
          <span id="hasilWA"></span>
        </p>
      </div>
    </div>
  </section>

  <footer>

    <p>
      Terima Kasih
    </p>

  </footer>

  <script>

    $(document).ready(function(){

      $(".form-card").hide().slideDown(1000);

      $("#contactForm").submit(function(e){

        e.preventDefault();

        let email = $("#email").val();
        let instagram = $("#instagram").val();
        let wa = $("#wa").val();

        $("#hasilEmail").text(email);
        $("#hasilInstagram").text(instagram);
        $("#hasilWA").text(wa);

        $("#hasil")
        .hide()
        .removeClass("d-none")
        .slideDown(1000);

      });

    });

  </script>

</body>
</html>
